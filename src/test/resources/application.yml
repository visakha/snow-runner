# Test configuration. Shadows the main application.yml entirely: H2 for
# both stores, and the small test catalog. No real database is ever touched.
snowrunner:
  catalog:
    location: classpath:test-catalog.yml
    tree-version: test-tree
  control:
    url: jdbc:h2:mem:snowrunner;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  snowflake:
    url: jdbc:h2:mem:etl;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  oracle:
    url: jdbc:h2:mem:etl;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

spring:
  application:
    name: snow-runner-test
  flyway:
    enabled: true
    locations: classpath:db/migration
